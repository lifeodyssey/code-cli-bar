name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated v-prefixed tag to package
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: main
        type: choice
        options:
          - main
          - dev

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Test, package, and draft release
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CHANNEL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || '' }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify annotated release tag and toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::$RELEASE_TAG must be an annotated tag."
            exit 1
          fi
          sw_vers -productVersion
          xcode-select -p
          swift --version

      - name: Resolve release channel
        shell: bash
        run: |
          set -euo pipefail
          channel="$CHANNEL_INPUT"
          if [[ -z "$channel" ]]; then
            if [[ "$RELEASE_TAG" == v*-dev.* ]]; then
              channel="dev"
            else
              channel="main"
            fi
          fi
          if [[ "$channel" != "main" && "$channel" != "dev" ]]; then
            echo "::error::Unsupported release channel: $channel"
            exit 1
          fi
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Fetch current shared appcast when available
        shell: bash
        run: |
          set -euo pipefail
          base_appcast="$RUNNER_TEMP/code-cli-bar-appcast.xml"
          if git ls-remote --exit-code --heads origin updates >/dev/null 2>&1; then
            git fetch --no-tags origin \
              refs/heads/updates:refs/remotes/origin/updates
            git show refs/remotes/origin/updates:appcast.xml > "$base_appcast"
            if grep -q "github.com/$GITHUB_REPOSITORY/" "$base_appcast"; then
              echo "CODE_CLI_BAR_BASE_APPCAST=$base_appcast" >> "$GITHUB_ENV"
            else
              echo "::notice::Ignoring the inherited upstream appcast; the first Code CLI Bar feed will start clean."
            fi
          else
            echo "No existing shared appcast; a future signed release can seed it."
          fi

      - name: Import optional Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::notice::No Developer ID certificate configured; the release will be ad-hoc signed."
            exit 0
          fi
          if [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::MACOS_CERTIFICATE_PASSWORD is required with MACOS_CERTIFICATE_P12."
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/code-cli-bar-release.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::No Developer ID Application identity found."
            exit 1
          fi
          echo "CODE_CLI_BAR_CODESIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Build verified release assets
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--channel "$RELEASE_CHANNEL")
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::notice::No Sparkle key configured; creating ZIP and checksum without an appcast."
            args+=(--skip-appcast)
          fi
          ./Scripts/release_app.sh "${args[@]}" "$RELEASE_TAG"

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-cli-bar-${{ env.RELEASE_TAG }}
          path: |
            .build/release/*.zip
            .build/release/*.sha256
            .build/release/appcast.xml
          if-no-files-found: error

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(.build/release/*.zip .build/release/*.sha256)
          if [[ -f .build/release/appcast.xml ]]; then
            assets+=(.build/release/appcast.xml)
          fi
          if [[ ${#assets[@]} -lt 2 ]]; then
            echo "::error::Expected at least a ZIP and SHA-256 checksum."
            exit 1
          fi

          release_title="Code CLI Bar ${RELEASE_TAG#v}"
          release_flags=(--draft --generate-notes --verify-tag)
          if [[ "$RELEASE_CHANNEL" == "dev" ]]; then
            release_title="Code CLI Bar ${RELEASE_TAG#v} (Dev)"
            release_flags+=(--prerelease --latest=false)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::Refusing to replace assets on a published release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$release_title"
          else
            gh release create "$RELEASE_TAG" \
              "${assets[@]}" \
              --title "$release_title" \
              "${release_flags[@]}"
          fi

          signing="ad-hoc"
          if [[ -n "${CODE_CLI_BAR_CODESIGN_IDENTITY:-}" ]]; then
            signing="Developer ID"
          fi
          {
            echo "### Draft release ready"
            echo
            echo "- Tag: $RELEASE_TAG"
            echo "- Channel: $RELEASE_CHANNEL"
            echo "- Signing: $signing"
            echo "- Review and publish: https://github.com/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
