name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          sw_vers -productVersion
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate release automation
        run: |
          bash -n \
            Scripts/build_app.sh \
            Scripts/release_app.sh \
            Scripts/generate_update_feed.sh
          ./Scripts/release_app.sh --help

      - name: Package release app
        run: ./Scripts/build_app.sh release

      - name: Verify packaged app
        run: |
          codesign --verify --deep --strict ".build/Code CLI Bar.app"
          test -f ".build/Code CLI Bar.app/Contents/Resources/CodeCLIBarIcon.icns"
          test "$(plutil -extract CFBundleIdentifier raw -o - '.build/Code CLI Bar.app/Contents/Info.plist')" = "com.lifeodyssey.CodeCLIBar"
